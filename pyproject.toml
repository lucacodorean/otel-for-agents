[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "otel-setup"
version = "0.1.0"
description = "Configurator for the Claude Code OpenTelemetry collector pipeline"
requires-python = ">=3.10"
dependencies = ["bcrypt>=4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6", "tzdata"]  # tzdata: zoneinfo on images without one (alpine)

[project.scripts]
otel_setup = "otel_setup.cli:main"

[tool.setuptools]
packages = ["otel_setup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/otel-setup etc. are not packages: importlib mode allows equal file names across suites,
# and the repository root on sys.path makes `tests.support` importable.
addopts = ["--import-mode=importlib", "-ra"]
pythonpath = ["."]
markers = ["docker: needs a Docker daemon (containers for promtool, the Collector, Prometheus, Grafana)"]
