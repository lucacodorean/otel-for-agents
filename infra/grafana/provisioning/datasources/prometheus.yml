apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: ${PROMETHEUS_DS_URL}
    isDefault: true
    editable: false
    basicAuth: true
    basicAuthUser: ${PROMETHEUS_DS_USER}
    secureJsonData:
      basicAuthPassword: ${PROMETHEUS_DS_PASSWORD}
    jsonData:
      httpMethod: POST
      timeInterval: 1m   # the live rules run every minute; the delta rules every 5m (panels override it)
